appId: com.lighteko.chagok
productName: 차곡
directories:
  output: release
files:
  - out/**
  - package.json
  - src/atomics/atoms/LICENSE.shadcn
  - src/shared/assets/fonts/OFL.txt
asar: true
publish:
  provider: github
  owner: lighteko
  repo: chagok
win:
  icon: build/icons/icon.ico
  executableName: chagok
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: chagok-${version}-setup.${ext}
npmRebuild: false
